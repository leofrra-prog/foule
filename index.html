<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crowd Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Crowd Lab</h1>
    <p>Mode édition: peins la salle. Mode simulation: lance et observe le flux.</p>
  </header>

  <main>
    <section class="panel">
      <div class="tabs">
        <button id="tabEdit" class="tab active">Édition</button>
        <button id="tabSim" class="tab">Simulation</button>
      </div>

      <div class="block">
        <h2>Outil</h2>
        <div class="tools">
          <label class="tool"><input type="radio" name="tool" value="wall" checked> Mur</label>
          <label class="tool"><input type="radio" name="tool" value="door"> Porte</label>
          <label class="tool"><input type="radio" name="tool" value="obstacle"> Obstacle</label>
          <label class="tool"><input type="radio" name="tool" value="erase"> Gomme</label>
          <label class="tool"><input type="radio" name="tool" value="spawn"> Zone spawn</label>
          <label class="tool"><input type="radio" name="tool" value="goal"> Cible</label>
        </div>
        <p class="hint">Clic ou clic maintenu pour peindre. Molette: zoom. Espace: déplacer la vue.</p>
      </div>

      <div class="block">
        <h2>Paramètres</h2>

        <div class="row">
          <label>Nombre de personnes <span id="popVal"></span></label>
          <input id="pop" type="range" min="10" max="1500" value="300" />
        </div>

        <div class="row">
          <label>Vitesse max <span id="vmaxVal"></span></label>
          <input id="vmax" type="range" min="0.5" max="7" step="0.1" value="2.8" />
        </div>

        <div class="row">
          <label>Attraction cible <span id="goalVal"></span></label>
          <input id="goalForce" type="range" min="0" max="6" step="0.05" value="1.4" />
        </div>

        <div class="row">
          <label>Répulsion personnes <span id="sepVal"></span></label>
          <input id="sepForce" type="range" min="0" max="10" step="0.1" value="4.2" />
        </div>

        <div class="row">
          <label>Répulsion murs <span id="wallVal"></span></label>
          <input id="wallForce" type="range" min="0" max="14" step="0.1" value="7.0" />
        </div>

        <div class="row">
          <label>Rayon (px) <span id="radVal"></span></label>
          <input id="radius" type="range" min="2" max="10" step="1" value="5" />
        </div>

        <div class="row buttons">
          <button id="clear">Tout effacer</button>
          <button id="fillRoom">Créer une salle</button>
        </div>

        <div class="row buttons">
          <button id="export">Exporter JSON</button>
          <button id="import">Importer JSON</button>
        </div>
      </div>

      <div class="block simOnly hidden" id="simBlock">
        <h2>Simulation</h2>
        <div class="row buttons">
          <button id="start">Démarrer</button>
          <button id="pause">Pause</button>
          <button id="resetAgents">Reset personnes</button>
        </div>
        <div class="row">
          <label>Traînées</label>
          <input id="trails" type="checkbox" />
        </div>
        <div class="row">
          <small class="hint">Astuce: fais un couloir étroit + grosse population pour voir les goulots.</small>
        </div>
      </div>
    </section>

    <section class="canvasWrap">
      <canvas id="c"></canvas>
      <div class="overlay">
        <div><span class="sw wall"></span> mur</div>
        <div><span class="sw door"></span> porte</div>
        <div><span class="sw obs"></span> obstacle</div>
        <div><span class="sw spawn"></span> spawn</div>
        <div><span class="sw goal"></span> cible</div>
      </div>
    </section>
  </main>

  <input id="file" type="file" accept="application/json" hidden />
  <script src="script.js"></script>
</body>
</html>
